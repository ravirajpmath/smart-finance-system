server.port=8080

spring.application.name=API-GATEWAY

# Eureka
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka

# Gateway Discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# USER SERVICE
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# INCOME SERVICE
spring.cloud.gateway.routes[1].id=income-service
spring.cloud.gateway.routes[1].uri=lb://INCOME-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/income/**

# EXPENSE SERVICE
spring.cloud.gateway.routes[2].id=expense-service
spring.cloud.gateway.routes[2].uri=lb://EXPENSE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/expense/**

# BUDGET SERVICE
spring.cloud.gateway.routes[3].id=budget-service
spring.cloud.gateway.routes[3].uri=lb://BUDGET-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/budget/**

# ===============================
# GLOBAL CORS CONFIG
# ===============================

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true