spring.application.name=BUDGET-SERVICE

server.port=8084

# BUDGET DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/budget_db
spring.datasource.username=dockeruser
spring.datasource.password=dockerpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.file.name=logs/budget-service.log
logging.level.root=INFO

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka