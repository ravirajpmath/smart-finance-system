<form (ngSubmit)="registerUser()">

    <div class="mb-3">
  
      <label class="form-label">
        Full Name
      </label>
  
      <input
        type="text"
        class="form-control"
        [(ngModel)]="name"
        name="name"
        placeholder="Enter name"
      >
  
    </div>
  
    <div class="mb-3">
  
      <label class="form-label">
        Email
      </label>
  
      <input
        type="email"
        class="form-control"
        [(ngModel)]="email"
        name="email"
        placeholder="Enter email"
      >
  
    </div>
  
    <div class="mb-3">
  
      <label class="form-label">
        Password
      </label>
  
      <input
        type="password"
        class="form-control"
        [(ngModel)]="password"
        name="password"
        placeholder="Enter password"
      >
  
    </div>
  
    <button class="btn btn-success w-100">
      Register
    </button>
  
  </form>
